name: FossFLOW tests and Docker
on:
  push:
    branches: ["main"]
    paths: ["fossflow/**", "!fossflow/docs/**", "!fossflow/*.md", "!fossflow/tests/README.md", ".github/workflows/fossflow*.yaml", ".github/fossflow*.json"]
  pull_request:
    paths: ["fossflow/**", "!fossflow/docs/**", "!fossflow/*.md", "!fossflow/tests/README.md", ".github/workflows/fossflow*.yaml", ".github/fossflow*.json"]
  workflow_dispatch:
concurrency:
  group: fossflow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: node --test fossflow/tests/updater.test.mjs
      - name: Exercise the real updater without publication
        id: plan
        run: node fossflow/automation/update.mjs --ci --plan update.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fossflow-ci-candidate
          path: update.json
          if-no-files-found: error
  validate:
    needs: candidate
    uses: ./.github/workflows/fossflow-ci.yaml
    with:
      ref: ${{ github.sha }}
      candidate_artifact: fossflow-ci-candidate
  source_when_base_changed:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true'
    uses: ./.github/workflows/fossflow-ci.yaml
    with:
      ref: ${{ github.sha }}
