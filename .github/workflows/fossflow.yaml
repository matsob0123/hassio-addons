name: FossFLOW tests and Docker
on:
  push:
    paths: ["fossflow/**", ".github/workflows/fossflow.yaml"]
  pull_request:
    paths: ["fossflow/**", ".github/workflows/fossflow.yaml"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: fossflow
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fossflow/package-lock.json
      - run: python3 -m pip install pyyaml
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:frontend
      - name: Frontend TypeScript check
        run: node .work/upstream/node_modules/typescript/bin/tsc --noEmit -p .work/upstream/packages/fossflow-app/tsconfig.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: fossflow/test-results/
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            ha_arch: amd64
          - platform: linux/arm64
            ha_arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the actual runtime image
        uses: docker/build-push-action@v6
        with:
          context: fossflow
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.ha_arch }}
            BUILD_VERSION=1.1.0
          tags: fossflow-ha:test
          load: true
          cache-from: type=gha,scope=${{ matrix.ha_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ha_arch }}
      - name: Runtime API tests inside image
        run: |
          docker run --rm --platform '${{ matrix.platform }}' \
            -v "$PWD:/suite:ro" --entrypoint sh fossflow-ha:test \
            -c 'apk add --no-cache openssl >/dev/null && node --test /suite/tests/*.test.mjs'
      - name: Entrypoint, health check and termination
        run: |
          docker run -d --name fossflow-smoke --platform '${{ matrix.platform }}' fossflow-ha:test
          timeout 60 sh -c 'until docker exec fossflow-smoke node -e "fetch(\"http://127.0.0.1:8099/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; do sleep 2; done'
          docker exec fossflow-smoke node -e 'fetch("http://127.0.0.1:8099/").then(r=>process.exit(r.status===403?0:1))'
          docker stop --time 30 fossflow-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' fossflow-smoke)" = 0
          docker logs fossflow-smoke
          docker rm fossflow-smoke
