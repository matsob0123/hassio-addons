name: Build & Publish SpotiFLAC Add-on

on:
  push:
    branches:
      - main
    paths:
      - "spotiflac/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' spotiflac/config.yaml | sed 's/version:[[:space:]]*//' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./spotiflac
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hassio-addons/spotiflac:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/hassio-addons/spotiflac:latest
          labels: |
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.type=addon
            io.hass.arch=amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
