name: xTeVe
version: "2.5.3.3"
slug: xteve
description: M3U Proxy for Plex DVR and Emby/Jellyfin Live TV — with FFmpeg, SSDP and web auth
url: https://github.com/matsob0123/hassio-addons
arch:
  - aarch64
  - amd64
startup: services
boot: auto
host_network: true
apparmor: true
watchdog: "http://[HOST]:[PORT:34400]/web"
ports:
  34400/tcp: 34400
map:
  - config:rw
  - share:rw
options:
  TZ: "Europe/Warsaw"
  PUID: 1000
  PGID: 1000
  ssdp: true
  username: ""
  password: ""
  log_level: "info"
schema:
  TZ: str
  PUID: int
  PGID: int
  ssdp: bool
  username: str?
  password: password?
  log_level: list(info|debug)
