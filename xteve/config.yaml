name: xTeVe
version: "2.5.3"
slug: xteve
description: M3U Proxy for Plex DVR and Emby/Jellyfin Live TV
url: https://github.com/matsob0123/hassio-addons
arch:
  - aarch64
  - amd64
startup: services
boot: auto
host_network: false
apparmor: true
ingress: true
ingress_port: 34400
ports:
  34400/tcp: 34400
map:
  - config:rw
  - share:rw
environment:
  XTEVE_CONF: /data/conf
  XTEVE_HOME: /data
