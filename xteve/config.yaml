name: xTeVe
version: "2.5.3-4"
slug: xteve
description: M3U Proxy for Plex DVR and Emby/Jellyfin Live TV
url: https://github.com/matsob0123/hassio-addons
image: ghcr.io/alexbelgium/xteve-{arch}
arch:
  - aarch64
  - amd64
startup: services
boot: auto
host_network: true
apparmor: true
udev: true
webui: "[PROTO:ssl]://[HOST]:[PORT:34400]/web"
ports:
  34400/tcp: 34400
map:
  - config:rw
  - share:rw
  - ssl:ro
environment:
  XTEVE_CONF: /data/conf
  XTEVE_HOME: /data
options:
  env_vars: []
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
